<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KIRAATHANE · 3D Online Masa Oyunları</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:#f3ead7;background:#1a0f0a radial-gradient(ellipse at 50% 30%,#4a2a18 0%,#24130b 55%,#120905 100%);user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:600;color:#2a1608;background:linear-gradient(#f7d77d,#d9a73c);box-shadow:0 3px 0 #8a5a14,0 6px 14px #0007;transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.08)}button:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a14,0 3px 8px #0007}
button.ghost{background:#ffffff14;color:#f3ead7;box-shadow:inset 0 0 0 1px #ffffff2a}
button.red{background:linear-gradient(#e46b5d,#b5382b);color:#fff;box-shadow:0 3px 0 #6d1a12,0 6px 14px #0007}
button.green{background:linear-gradient(#7fd88e,#3d9d52);color:#062b0f;box-shadow:0 3px 0 #1f5a2b,0 6px 14px #0007}
button:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
button.sm{padding:6px 11px;font-size:13px;border-radius:8px}
input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #ffffff33;background:#00000055;color:#fff;outline:none}
input:focus,select:focus{border-color:#f7d77d}
select option{background:#2a1608}
.screen{position:fixed;inset:0;display:none}.screen.on{display:block}
.muted{opacity:.65;font-size:13px}
h1.logo{font-family:Georgia,'Times New Roman',serif;font-size:clamp(34px,6vw,64px);letter-spacing:2px;text-align:center;color:#f7d77d;text-shadow:0 3px 0 #7a4b10,0 8px 30px #000}
h1.logo small{display:block;font:600 14px 'Segoe UI',sans-serif;letter-spacing:6px;color:#e9cf9a;opacity:.85;margin-top:6px}
.panel{background:linear-gradient(#2d1a0fee,#1c100ae8);border:1px solid #f7d77d33;border-radius:18px;box-shadow:0 20px 60px #000a,inset 0 1px 0 #ffffff14;padding:20px}
/* ---- ana menü ---- */
#home{overflow:auto}
.homeWrap{max-width:1040px;margin:0 auto;padding:34px 18px 40px;display:flex;flex-direction:column;gap:22px}
.profile{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.avs{display:flex;gap:4px;flex-wrap:wrap}.avs span{font-size:24px;cursor:pointer;padding:3px 5px;border-radius:8px;opacity:.55}.avs span.on{opacity:1;background:#f7d77d33;box-shadow:inset 0 0 0 1px #f7d77d}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gcard{position:relative;border-radius:16px;padding:16px;cursor:pointer;background:linear-gradient(160deg,#1f5c3a,#0f3a23);border:2px solid #ffffff1a;box-shadow:0 10px 26px #0008;transition:transform .2s,border-color .2s;transform:perspective(700px) rotateX(6deg);min-height:150px}
.gcard:hover{transform:perspective(700px) rotateX(0) translateY(-4px)}
.gcard.sel{border-color:#f7d77d;box-shadow:0 0 0 3px #f7d77d55,0 14px 30px #000a}
.gcard .gi{font-size:40px;filter:drop-shadow(0 4px 4px #0008)}.gcard b{display:block;font-size:20px;margin:6px 0 4px;color:#fff}
.gcard p{font-size:12.5px;line-height:1.35;opacity:.8}.gcard .pc{position:absolute;top:12px;right:12px;font-size:12px;background:#0006;border-radius:20px;padding:3px 9px}
.homeBtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.homeBtns button{font-size:17px;padding:14px 22px}
.joinRow{display:flex;gap:8px;justify-content:center}.joinRow input{width:150px;text-transform:uppercase;letter-spacing:6px;font-size:20px;text-align:center}
/* ---- lobi ---- */
#lobby{overflow:auto}
.lobWrap{max-width:900px;margin:0 auto;padding:30px 16px;display:flex;flex-direction:column;gap:16px}
.codeBox{text-align:center}.codeBox .code{font:700 58px Georgia,serif;letter-spacing:14px;color:#f7d77d;text-shadow:0 4px 0 #7a4b10}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seat{border-radius:14px;padding:14px 8px;text-align:center;background:#00000040;border:1px dashed #ffffff30;min-height:110px;position:relative}
.seat.full{border-style:solid;border-color:#f7d77d55;background:#f7d77d12}.seat .av{font-size:34px}.seat .nm{font-weight:700;margin-top:4px;word-break:break-word}
.seat .tag{font-size:11px;opacity:.7}.seat .x{position:absolute;top:4px;right:6px;font-size:12px;cursor:pointer;opacity:.6}
.optRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#netDiag{font-size:11px;opacity:.55;text-align:center}
@media(max-width:640px){.seats{grid-template-columns:repeat(2,1fr)}}
/* ---- masa ---- */
#table{background:#120905 radial-gradient(ellipse at 50% 40%,#3b2213,#140a05 70%)}
#stage{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 18%;overflow:hidden}
#boardWrap{position:absolute;left:50%;top:50%;width:1400px;height:900px;margin:-450px 0 0 -700px;transform-style:preserve-3d}
#board{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(40deg) translateY(-30px);border-radius:300px/190px;
  background:radial-gradient(ellipse at 50% 45%,#2f8a52 0%,#1d6b3d 45%,#124a29 100%);
  box-shadow:0 0 0 26px #6b3a1c,0 0 0 30px #3e1f0c,0 0 0 34px #a06a37,0 40px 80px 40px #000c,inset 0 0 120px #0009}
#board::before{content:'';position:absolute;inset:18px;border-radius:280px/176px;border:2px solid #f7d77d22;pointer-events:none}
#board::after{content:'KIRAATHANE';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 120px Georgia,serif;letter-spacing:20px;color:#ffffff07;pointer-events:none;white-space:nowrap}
.o3{position:absolute;left:0;top:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.25,1),opacity .4s}
.o3.fast{transition:transform .3s cubic-bezier(.2,.8,.25,1)}
.o3.noanim{transition:none!important}
/* iskambil kartı */
.card{width:84px;height:120px;margin:-60px 0 0 -42px}
.card .f,.card .b{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .f{background:linear-gradient(160deg,#fffdf6,#efe8d6);box-shadow:0 0 0 1px #0003,0 2px 3px #0004;color:#1b1b1b;overflow:hidden}
.card .f.r{color:#c4161c}
.card .b{transform:rotateY(180deg);background:#7d1420;box-shadow:0 0 0 1px #0005;background-image:repeating-linear-gradient(45deg,#ffffff1a 0 3px,transparent 3px 9px),repeating-linear-gradient(-45deg,#ffffff1a 0 3px,transparent 3px 9px);border:4px solid #f5ecd6}
.card .b::after{content:'K';position:absolute;inset:0;display:grid;place-items:center;font:700 30px Georgia,serif;color:#f7d77d;text-shadow:0 2px 0 #3d0710}
.card .ci{position:absolute;left:5px;top:3px;font-weight:800;font-size:20px;line-height:.95;text-align:center;font-family:Georgia,serif}
.card .ci i{display:block;font-style:normal;font-size:17px}
.card .ci.br{left:auto;top:auto;right:5px;bottom:3px;transform:rotate(180deg)}
.card .cm{position:absolute;inset:0;display:grid;place-items:center;font-size:44px}
.card .cm.face{font:700 40px Georgia,serif}
.card .cm.face span{display:grid;place-items:center;width:52px;height:74px;border-radius:6px;background:linear-gradient(#f9e7b7,#e7c979);box-shadow:inset 0 0 0 2px currentColor}
.card.legal{cursor:pointer}.card.legal .f{box-shadow:0 0 0 2px #f7d77d,0 0 18px #f7d77daa}
.card.dim .f{filter:brightness(.62)}
.card.mine{cursor:pointer}
.shadow3{position:absolute;inset:6px;border-radius:8px;background:#0007;transform:translateZ(-2px);filter:blur(6px)}
/* okey taşı */
.tile{width:46px;height:64px;margin:-32px 0 0 -23px}
.tile .f,.tile .b{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tile .f{background:linear-gradient(#fffaf0,#eee3c8);box-shadow:0 0 0 1px #0002,0 3px 0 #c9b88d,0 4px 3px #0005}
.tile .b{transform:rotateY(180deg);background:linear-gradient(#f2e9d2,#dccb9f);box-shadow:0 0 0 1px #0002,0 3px 0 #b39f6e}
.tf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 30px Georgia,serif;line-height:1}
.tf::after{content:'';width:9px;height:9px;border-radius:50%;margin-top:4px;background:currentColor;opacity:.9}
.c0{color:#e0a100}.c1{color:#1565c0}.c2{color:#1a1a1a}.c3{color:#c62828}
.tf.fk{font-size:26px;color:#2e7d32}.tf.fk::after{display:none}
.tf.wild{text-shadow:0 0 6px #f7d77d}
.tile.small{width:34px;height:47px;margin:-23px 0 0 -17px}.tile.small .tf{font-size:21px}.tile.small .tf::after{width:6px;height:6px;margin-top:2px}
.meldBox{position:absolute;left:0;top:0;padding:5px 6px 7px;border-radius:9px;background:#00000038;display:flex;gap:2px;cursor:pointer;transform-style:preserve-3d;border-bottom:3px solid transparent}
.meldBox:hover,.meldBox.target{background:#f7d77d40}
.meldBox .tile{position:relative;margin:0}
.rack3d{width:560px;height:30px;margin:-15px 0 0 -280px;background:linear-gradient(#a86b35,#6b3e19);border-radius:6px;box-shadow:0 6px 0 #3e2109,0 10px 14px #0008}
.lbl3{position:absolute;left:0;top:0;white-space:nowrap;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 3px #000;transform-style:preserve-3d}
.lbl3 small{font-size:15px;opacity:.75}
.spot{width:58px;height:78px;margin:-39px 0 0 -29px;border-radius:9px;border:2px dashed #ffffff33}
.spot.can{border-color:#f7d77d;box-shadow:0 0 20px #f7d77d88;cursor:pointer}
.pileTop.can{cursor:pointer;filter:drop-shadow(0 0 12px #f7d77d)}
/* HUD */
.plate{position:absolute;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:40px;background:linear-gradient(#2d1a0fee,#170c06ee);border:1px solid #f7d77d33;box-shadow:0 8px 20px #0009;z-index:5;min-width:150px;transition:box-shadow .3s}
.plate .av{font-size:28px;width:40px;height:40px;display:grid;place-items:center;background:#ffffff12;border-radius:50%}
.plate .nm{font-weight:700;font-size:14px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate .sc{font-size:12px;opacity:.85}.plate .bd{font-size:11px;color:#f7d77d}
.plate.turn{box-shadow:0 0 0 3px #f7d77d,0 0 28px #f7d77daa}
.plate.off{opacity:.55}
.plate .bub{position:absolute;bottom:110%;left:10px;background:#fff;color:#222;padding:6px 10px;border-radius:12px;font-size:13px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 14px #0007;animation:pop .25s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.p0{left:16px;bottom:16px}.p1{right:14px;top:44%}.p2{left:50%;top:12px;transform:translateX(-50%)}.p3{left:14px;top:44%}
#topbar{position:absolute;right:12px;top:10px;display:flex;gap:6px;z-index:8}
#info{position:absolute;left:12px;top:10px;z-index:6;font-size:13px;line-height:1.5;max-width:300px}
#info .gn{font:700 18px Georgia,serif;color:#f7d77d}
#log{position:absolute;right:12px;top:56px;z-index:4;font-size:12.5px;max-width:270px;text-align:right;opacity:.85;line-height:1.55;pointer-events:none}
#log div:first-child{font-weight:700;color:#f7d77d}
#status{position:absolute;left:50%;transform:translateX(-50%);bottom:198px;z-index:7;padding:8px 18px;border-radius:30px;background:#000a;font-weight:600;font-size:15px;white-space:nowrap;pointer-events:none}
#status:empty{display:none}#status.me{background:#f7d77d;color:#2a1608;box-shadow:0 0 24px #f7d77d88}
#actions{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;z-index:9;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:96vw}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:50;background:#c62828;color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px #000a;display:none;max-width:90vw;text-align:center}
#big{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:40;font:800 clamp(40px,9vw,96px) Georgia,serif;color:#f7d77d;text-shadow:0 5px 0 #7a4b10,0 10px 40px #000;pointer-events:none;display:none;animation:bigIn .9s}
@keyframes bigIn{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
/* ıstaka */
#rackWrap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:8;perspective:900px;display:none}
#rack{transform:rotateX(18deg);transform-origin:50% 100%;padding:10px 14px 14px;border-radius:14px 14px 6px 6px;background:linear-gradient(#b07a43,#7a4a22 60%,#5a3416);box-shadow:0 -6px 30px #0009,inset 0 2px 0 #e5b27a,inset 0 -6px 0 #3e2109}
.rrow{display:flex;gap:3px;height:66px;padding:2px 0 4px;border-bottom:5px solid #4a2a10;margin-bottom:6px}.rrow:last-child{margin-bottom:0}
.slot{width:44px;height:62px;border-radius:6px;background:#00000018;position:relative}
.slot.over{background:#f7d77d55}
.rt{position:absolute;inset:0;border-radius:6px;background:linear-gradient(#fffaf0,#ebdfc2);box-shadow:0 0 0 1px #0002,0 3px 0 #c2ae7e,0 5px 5px #0006;cursor:grab;transition:transform .12s}
.rt:hover{transform:translateY(-3px)}
.rt.sel{transform:translateY(-12px);box-shadow:0 0 0 2px #f7d77d,0 3px 0 #c2ae7e,0 10px 16px #f7d77d88}
.rt.new{animation:newT 1.2s}@keyframes newT{0%,60%{box-shadow:0 0 0 3px #4caf50,0 3px 0 #c2ae7e,0 0 18px #4caf50}}
.rt.must{box-shadow:0 0 0 3px #e53935,0 3px 0 #c2ae7e}
.rt .tf{font-size:28px}
.rt.ghost{position:fixed;pointer-events:none;z-index:100;width:44px;height:62px;transform:scale(1.12) rotate(-4deg);box-shadow:0 14px 26px #000a;transition:none}
#rackInfo{position:absolute;left:12px;bottom:calc(100% + 6px);font-size:12.5px;font-weight:600;background:#000a;padding:4px 10px;border-radius:12px}
/* modal */
.modal{position:fixed;inset:0;background:#000a;z-index:60;display:none;place-items:center;padding:16px}.modal.on{display:grid}
.modal .panel{min-width:min(520px,94vw);max-width:94vw;max-height:90vh;overflow:auto}
.modal h2{font:700 26px Georgia,serif;color:#f7d77d;margin-bottom:12px;text-align:center}
table.sum{width:100%;border-collapse:collapse;font-size:14px}table.sum td,table.sum th{padding:8px 6px;border-bottom:1px solid #ffffff1a;text-align:left}
table.sum tr.win td{color:#f7d77d;font-weight:700}
.revealRow{display:flex;gap:2px;flex-wrap:wrap;margin:2px 0 8px}.revealRow .mt{width:24px;height:32px;border-radius:4px;background:#fffaf0;display:grid;place-items:center;font:800 15px Georgia,serif}
/* sohbet */
#chat{position:absolute;right:12px;bottom:12px;z-index:10;width:270px;display:none;flex-direction:column;gap:6px}
#chat.on{display:flex}
#chatLog{max-height:180px;overflow:auto;font-size:13px;background:#000a;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:3px}
#chatLog b{color:#f7d77d}
.emos{display:flex;gap:3px;flex-wrap:wrap}.emos span{cursor:pointer;font-size:20px}
.lobChat{display:flex;flex-direction:column;gap:6px}
.lobChat #lchatLog{height:120px;overflow:auto;background:#0006;border-radius:10px;padding:8px;font-size:13px}
.lobChat #lchatLog b{color:#f7d77d}
@media(max-width:800px){#status{bottom:170px;font-size:13px}#actions{bottom:122px}.plate{min-width:0;padding:4px 9px 4px 4px}.plate .av{width:30px;height:30px;font-size:20px}#log{display:none}}
body.cardsMode #status{bottom:auto;top:80px}
body.cardsMode #actions{bottom:auto;top:42%;transform:translate(-50%,-50%)}
body.tilesMode #actions{bottom:196px}
body.tilesMode #status{bottom:240px}
body.tilesMode .p0{bottom:200px}

.rulesPanel{width:min(820px,96vw)}
.rtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#rBody{font-size:14.5px;line-height:1.55;max-height:64vh;overflow:auto;padding-right:6px}
#rBody h3{font:700 24px Georgia,serif;color:#f7d77d;margin:4px 0 8px}#rBody h4{color:#f7d77d;margin:14px 0 6px;font-size:16px}
#rBody ul{padding-left:20px;margin:4px 0}#rBody li{margin:3px 0}#rBody p{margin:6px 0}
table.rtbl{border-collapse:collapse;margin:8px 0;width:100%;font-size:13.5px}table.rtbl td,table.rtbl th{border:1px solid #ffffff22;padding:6px 8px;text-align:left}table.rtbl th{background:#f7d77d22;color:#f7d77d}
a.dl{display:inline-block;padding:10px 16px;border-radius:10px;background:#ffffff14;color:#f3ead7;text-decoration:none;font-weight:600;box-shadow:inset 0 0 0 1px #ffffff2a}
.plate .tm{font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px;background:#ffffff22}
.plate .clock{position:absolute;top:-8px;right:-6px;background:#c62828;color:#fff;font-weight:800;font-size:12px;border-radius:12px;padding:2px 7px;box-shadow:0 2px 6px #0008}
.plate .clock.ok{background:#2e7d32}

.seat.sit{cursor:pointer;transition:background .2s}.seat.sit:hover{background:#7fd88e22;border-color:#7fd88e}
.seat.sit button{margin-top:6px}.seat.me{box-shadow:0 0 0 2px #f7d77d,0 0 18px #f7d77d55}
</style></head><body>
<div id="home" class="screen on">
  <div class="homeWrap">
    <h1 class="logo">KIRAATHANE<small>PİŞTİ · BATAK · OKEY · 101 — 3D ONLINE MASA</small></h1>
    <div class="panel profile">
      <input id="myName" maxlength="14" placeholder="Adın" style="width:170px">
      <div class="avs" id="avs"></div>
    </div>
    <div class="games" id="games"></div>
    <div class="homeBtns">
      <button id="bHost" class="green">🌐 Online Oda Kur</button>
      <button id="bSolo">🤖 Botlarla Oyna</button>
      <button id="bRulesHome" class="ghost">📖 Kurallar</button>
    </div>
    <div class="joinRow">
      <input id="joinCode" maxlength="4" placeholder="KOD">
      <button id="bJoin" class="ghost">🔑 Odaya Katıl</button>
    </div>
    <p class="muted" style="text-align:center">Oda kuran kodu arkadaşlarına söyler, onlar “Odaya Katıl”a yazar. Boş koltuklara bot oturur. Hiçbir şey kurulmaz, tarayıcıda çalışır.</p>
  </div>
</div>

<div id="lobby" class="screen">
  <div class="lobWrap">
    <div class="panel codeBox">
      <div class="muted" id="lobTitle">Oda kodu</div>
      <div class="code" id="lobCode">––––</div>
      <div class="muted" id="lobSt">Bağlanılıyor…</div>
    </div>
    <div class="seats" id="seats"></div>
    <div class="panel">
      <div class="optRow" id="lobGame"></div>
      <div class="optRow" id="lobOpts" style="margin-top:10px"></div>
    </div>
    <div class="panel lobChat">
      <div id="lchatLog"></div>
      <div class="optRow"><input id="lchatIn" maxlength="120" placeholder="Mesaj yaz…" style="flex:1"><button class="sm" id="lchatSend">Gönder</button></div>
    </div>
    <div class="homeBtns">
      <button id="bStart" class="green">▶ Oyunu Başlat</button>
      <button id="bLeave" class="red">Odadan Çık</button>
    </div>
    <div id="netDiag"></div>
  </div>
</div>

<div id="table" class="screen">
  <div id="stage"><div id="boardWrap"><div id="board"></div></div></div>
  <div id="info"></div>
  <div id="log"></div>
  <div id="topbar">
    <button class="sm ghost" id="bRules" title="Kurallar">📖</button>
    <button class="sm ghost" id="bChat">💬</button>
    <button class="sm ghost" id="bSound">🔊</button>
    <button class="sm ghost" id="bScore">📊</button>
    <button class="sm red" id="bExit">✕</button>
  </div>
  <div id="plates"></div>
  <div id="status"></div>
  <div id="actions"></div>
  <div id="rackWrap"><div id="rackInfo"></div><div id="rack"><div class="rrow" id="row0"></div><div class="rrow" id="row1"></div></div></div>
  <div id="chat"><div id="chatLog"></div><div class="emos" id="emos"></div><div class="optRow"><input id="chatIn" maxlength="120" placeholder="Mesaj…" style="flex:1;padding:7px"><button class="sm" id="chatSend">➤</button></div></div>

"use strict";
const RULES_HTML={"okey101": "<h3>💯 101 Okey</h3>\n<p><b>Oyuncu:</b> 4 kişi · <b>Taş:</b> 106 (1–13 arası, 4 renk, her taştan 2 tane + 2 sahte okey) · <b>Kazanan:</b> oyun sonunda <b>en düşük</b> puana sahip olan.</p>\n<h4>Dağıtım, gösterge ve okey</h4>\n<ul>\n<li>Her oyuncuya 21 taş dağıtılır; oyunu başlatan oyuncu 22 taş alır ve ilk hamlesi taş atmaktır.</li>\n<li>Ortadan bir taş açılır: <b>gösterge</b>. Göstergeyle aynı renkte ve bir büyük sayıdaki taş o elin <b>okeyidir</b> (joker). Gösterge 13 ise okey aynı rengin 1'idir.</li>\n<li>Okey her taşın yerine geçebilir. <b>Sahte okey (★)</b> joker değildir; sadece o elin okey taşının yerine (rengi ve sayısıyla) kullanılır.</li>\n<li>Oyun saat yönünün tersine döner; her el başlatan oyuncu bir sağa kayar.</li>\n</ul>\n<h4>Perler</h4>\n<ul>\n<li><b>Seri:</b> aynı renkte en az 3 ardışık taş (ör. kırmızı 4-5-6). <b>1 sadece serinin başında olabilir; 12-13-1 geçersizdir.</b> Seri iki ucundan uzatılabilir.</li>\n<li><b>Küt (aynı sayı):</b> aynı sayının farklı renklerinden 3 ya da 4 taş. Aynı renk iki kez olamaz.</li>\n<li><b>Çift:</b> aynı renk ve sayıdan iki taş (biri okey olabilir). Çiftler uzatılamaz.</li>\n</ul>\n<h4>Sıra</h4>\n<ul>\n<li><b>Çek:</b> ortadan bir taş çek ya da solundaki oyuncunun son attığı taşı al.</li>\n<li><b>Aç / indir / işle</b> (isteğe bağlı).</li>\n<li><b>At:</b> bir taş at. Her tur, son tur dahil, taş atarak biter; elindeki bütün taşları yere indirip atmadan bitiremezsin.</li>\n</ul>\n<h4>El açmak</h4>\n<ul>\n<li><b>Seriden açma:</b> aynı turda yere indirdiğin perlerin toplamı en az <b>101</b> olmalı. Taşlar üzerindeki sayı kadar sayılır, okey yerine geçtiği taşın değerini alır.</li>\n<li><b>Çiftten açma:</b> aynı turda en az <b>5 çift</b> indirirsin; sayıların önemi yoktur.</li>\n<li><b>Katlamalı (varsayılan):</b> her yeni açış bir öncekini geçmelidir. Biri 120 ile açtıysa sonraki seriden açış en az 121, biri 6 çiftle açtıysa sonraki çift açış en az 7 çift olmalı. Seri ve çift ayrı sayılır. <b>Katlamasız</b> modda sınır hep 101 / 5 çifttir.</li>\n<li>Seriden açan sonra çift indiremez. Çiftten açan yeni seri/küt kuramaz ama masadaki perlere taş işleyebilir ve yeni çift indirebilir.</li>\n<li><b>Siler (varsayılan açık):</b> 150 ve üzeri seriyle ya da 7 ve üzeri çiftle açan oyuncu <b>−101 ödül</b> alır.</li>\n</ul>\n<h4>Yandan taş almak</h4>\n<ul>\n<li>Soldan aldığın taşı <b>aynı turda kullanmak zorundasın</b> (açarken ya da açtıysan per/işleme olarak). Elde tutamazsın.</li>\n<li>Kullanamazsan hiçbir şey indirmeden <b>geri verebilir</b> ve ortadan çekebilirsin; cezası yoktur. Yere taş indirdikten sonra geri verirsen <b>101 ceza</b> yazılır.</li>\n<li><b>Yere atılan okey alınamaz.</b></li>\n</ul>\n<h4>İşlemek ve okey almak</h4>\n<ul>\n<li>Elini açtıktan sonra masadaki herkesin perine uyan taşları ekleyebilirsin (seriye uç, kütte eksik renk).</li>\n<li><b>Okey alma:</b> masadaki bir perde okeyin yerine geçtiği gerçek taş sende varsa onu koyup okeyi eline alırsın. Kütlerde bu, 4 renk tamamlanmışsa olur. Okeyi o pere koyan başka bir oyuncuysa ona <b>101 ceza</b> yazılır.</li>\n</ul>\n<h4>Cezalar (her biri 101)</h4>\n<ul>\n<li><b>Okey atmak.</b></li>\n<li><b>İşlek taş atmak:</b> masadaki bir pere işlenebilecek taşı atmak (henüz açmamış olsan bile). Bitiriş taşı hariç.</li>\n<li>Okeyi masada başkasına aldırmak (yukarıda).</li>\n</ul>\n<h4>El sonu ve puanlama</h4>\n<p>Elini bitiren (son taşını atan) oyuncu <b>−101</b> alır. Diğerleri:</p>\n<table class=\"rtbl\"><tr><th>Durum</th><th>Açan oyuncu</th><th>Çiftten açan</th><th>Açamayan</th></tr><tr><td>Normal bitiş</td><td>eldeki taşların toplamı</td><td>toplam × 2</td><td>202</td></tr><tr><td>Okey atarak bitiş (bitiren −202)</td><td>toplam × 2</td><td>toplam × 4</td><td>404</td></tr><tr><td>Çiftten bitiş (bitiren −202)</td><td>toplam × 2</td><td>toplam × 4</td><td>404</td></tr><tr><td>Çiftten + okeyle bitiş (bitiren −404)</td><td>toplam × 4</td><td>toplam × 8</td><td>404</td></tr></table>\n<ul>\n<li>Elde kalan <b>okey 101</b> sayılır.</li>\n<li><b>Elden bitme:</b> daha kimse açmamışken bir oyuncu tek turda açıp bitirirse bitiren −202, diğer herkes <b>404</b> (okeyle bitirirse −404 / <b>808</b>).</li>\n<li><b>Deste biterse:</b> kimse açmadıysa o el yazılmaz. Açan varsa açamayanlara 202, açanlara elindeki taşlar yazılır; bitiren olmaz.</li>\n<li>Elde yazılan cezalar (okey atma, işlek taş, siler) o elin puanına eklenir.</li>\n<li>Belirlenen el sayısı oynanır, <b>toplamı en düşük olan kazanır.</b></li>\n</ul>\n<p><b>Oyundaki ayarlar:</b> El sayısı (1/3/5/7/9/11) · Katlamalı / Katlamasız · Siler açık/kapalı · Hamle süresi.</p>", "okey": "<h3>🀄 Okey (Düz Okey)</h3>\n<p><b>Oyuncu:</b> 4 kişi · <b>Taş:</b> 106 · <b>Kazanan:</b> puanı 0'a ilk düşen olunca, o an <b>en yüksek</b> puana sahip oyuncu.</p>\n<h4>Dağıtım</h4>\n<ul>\n<li>Herkese 14 taş; oyunu başlatan 15 taş alır ve ilk hamlesi taş atmaktır.</li>\n<li>Gösterge ve okey 101'deki gibidir (göstergenin bir üstü okey, 13'ün üstü 1). Sahte okey (★) okey taşının yerine geçer.</li>\n</ul>\n<h4>Sıra</h4>\n<ul>\n<li>Ortadan çek <b>ya da</b> solundakinin attığı son taşı al, sonra bir taş at. Atılan okey alınabilir.</li>\n<li>Ortada taş biterse el <b>berabere</b> biter, puan değişmez.</li>\n</ul>\n<h4>Bitirmek</h4>\n<ul>\n<li>15 taşın 14'ü perlere (seri ya da küt; <b>12-13-1 yok</b>) ya da <b>7 çifte</b> dizilmişken 15. taşı atarak bitirirsin. Perleri yere açmak yoktur, el bittiğinde gösterilir.</li>\n</ul>\n<h4>Puanlama (20'den düşme)</h4>\n<p>Herkes <b>20 puanla</b> başlar (ayar: 20/12/6). El bitince bitiren <b>dışındaki</b> herkesten düşülür:</p>\n<table class=\"rtbl\"><tr><th>Bitiş</th><th>Diğerlerinden düşülen</th></tr><tr><td>Normal</td><td>2</td></tr><tr><td>Okey atarak</td><td>4</td></tr><tr><td>Çiftten (7 çift)</td><td>4</td></tr><tr><td>Çiftten + okey atarak</td><td>8</td></tr></table>\n<ul>\n<li><b>Gösterge:</b> elinde göstergenin aynısı olan oyuncu ilk hamlesini yapmadan önce onu gösterirse diğer herkesten <b>1 puan</b> düşülür.</li>\n<li>Bir oyuncunun puanı 0 ya da altına inince oyun biter; en yüksek puanlı kazanır.</li>\n</ul>\n<p><b>Oyundaki ayarlar:</b> Başlangıç puanı (20/12/6) · Hamle süresi.</p>", "batak": "<h3>♠️ Batak</h3>\n<p><b>Oyuncu:</b> 4 kişi · <b>Deste:</b> 52 kart, as en büyük · <b>Kazanan:</b> belirlenen el sayısı sonunda en yüksek puan.</p>\n<h4>Modlar</h4>\n<ul>\n<li><b>İhaleli (tekli):</b> herkes kendi için oynar; ihaleyi alan kozu seçer.</li>\n<li><b>Eşli ihaleli:</b> karşılıklı oturanlar takımdır; ihale takımın toplam eliyle tutturulur.</li>\n<li><b>Koz Maça:</b> ihale yok, koz her zaman <b>maça</b>. Herkes kaç el alacağını söyler.</li>\n</ul>\n<h4>İhale (İhaleli ve Eşli)</h4>\n<ul>\n<li>13'er kart dağıtılır. Dağıtanın sağındaki başlayarak herkes bir öncekinden <b>yüksek</b> bir sayı söyler ya da <b>pas</b> der. Pas diyen tekrar giremez.</li>\n<li>En düşük ihale <b>5</b> (ayar: 4). Kimse ihaleye girmezse ihale <b>4</b> ile dağıtana kalır.</li>\n<li>İhaleyi alan kozu seçer ve ilk eli o açar.</li>\n</ul>\n<h4>Oyun kuralları (tüm modlar)</h4>\n<ul>\n<li>Koz henüz oynanmadıysa ele kozla başlanamaz (elinde sadece koz kalmadıysa).</li>\n<li>Yerdeki rengi <b>takip etmek zorundasın</b>.</li>\n<li>Aynı renkten yerdekinden <b>büyük</b> kartın varsa onu oynamak zorundasın (<b>yükseltme</b>). Yoksa o renkten istediğini atarsın.</li>\n<li>O renk sende yoksa <b>koz çakmak zorundasın</b>. Yerde koz varsa ve daha büyük kozun varsa onu atmalısın.</li>\n<li>Renk yerine koz çakılmışsa ve sende o renk varsa, o renkten istediğin kartı atabilirsin (yükseltme gerekmez).</li>\n<li>Renk de koz da yoksa istediğin kartı atarsın.</li>\n<li>Eli yerdeki en büyük koz, koz yoksa açılan rengin en büyük kartı alır; eli alan sonraki eli açar.</li>\n</ul>\n<h4>Puanlama</h4>\n<p><b>Onluk (×10, varsayılan — popüler uygulamalardaki gibi):</b></p>\n<ul>\n<li>İhaleyi (ya da sözünü) tutturan: <b>10 × ihale + fazla eller</b>. Tutturamayan (<b>batan</b>): <b>−10 × ihale</b>.</li>\n<li>İhaleye girmeyenler aldıkları el kadar puan alır; <b>hiç el alamayan</b> −10 × ihale yer.</li>\n<li>Eşlide aynı hesap takımın toplam eliyle yapılır ve iki ortağa da yazılır.</li>\n</ul>\n<p><b>Basit:</b> tutturan aldığı el kadar, batan −ihale; diğerleri aldığı el kadar.</p>\n<p><b>Koz Maça:</b> herkes kendi sözüne göre yukarıdaki gibi puan alır.</p>\n<p><b>Oyundaki ayarlar:</b> Mod · El sayısı (4/8/12/16) · En düşük ihale (5/4) · Puanlama (Onluk/Basit) · Hamle süresi.</p>", "pisti": "<h3>🃏 Pişti</h3>\n<p><b>Oyuncu:</b> 2 ya da 4 kişi (4 kişide <b>eşli</b> ya da tekli) · <b>Deste:</b> 52 kart · <b>Kazanan:</b> el sonunda hedef puana (101; ayar 51/151) ilk ulaşan. İki taraf aynı elde geçerse puanı yüksek olan kazanır.</p>\n<h4>Dağıtım</h4>\n<ul>\n<li>Ortaya 4 kart konur: 3'ü kapalı, en üstteki açık. Açık kart vale çıkarsa yerine başka kart açılır.</li>\n<li>Herkese 4'er kart dağıtılır. Kartlar bitince deste bitene kadar 4'er kart daha dağıtılır (yere kart konmaz).</li>\n</ul>\n<h4>Oynanış</h4>\n<ul>\n<li>Sırası gelen bir kart atar. Attığın kart yerdeki <b>en üst kartla aynı</b> ise (ör. 7'ye 7) yerdeki <b>bütün kartları</b> alırsın.</li>\n<li><b>Vale (J)</b> her zaman yerdekilerin hepsini alır.</li>\n<li>Eşleşmeyen kart yığının üstüne konur.</li>\n<li>İlk toplayan, başlangıçtaki kapalı 3 kartı da alır.</li>\n<li>Son kart oynandığında yerde kalanlar <b>en son toplayan</b> tarafa gider.</li>\n</ul>\n<h4>Pişti</h4>\n<ul>\n<li>Yerde <b>tek kart</b> varken aynısını atarak almak <b>pişti</b>dir: <b>10 puan</b>.</li>\n<li>Tek valeyi valeyle almak <b>vale piştisi</b>: <b>20 puan</b>.</li>\n<li>Valeyle tek (vale olmayan) kartı almak pişti sayılmaz.</li>\n<li>Elin en <b>son kartıyla</b> yapılan pişti sayılmaz (normal toplama olur).</li>\n</ul>\n<h4>El sonu puanları</h4>\n<table class=\"rtbl\"><tr><th>Kart / durum</th><th>Puan</th></tr><tr><td>Her as</td><td>1</td></tr><tr><td>Her vale</td><td>1</td></tr><tr><td>Sinek 2'li (♣2)</td><td>2</td></tr><tr><td>Karo 10'lu (♦10)</td><td>3</td></tr><tr><td>En çok kart toplayan</td><td>3 (eşitlikte kimse almaz)</td></tr><tr><td>Her pişti / vale piştisi</td><td>10 / 20</td></tr></table>\n<p>Eşli oyunda iki ortağın kartları ve puanları birlikte sayılır.</p>\n<p><b>Oyundaki ayarlar:</b> Oyuncu sayısı (2/4) · 4 kişide Eşli/Tekli · Oyun sonu (51/101/151) · Hamle süresi.</p>", "_common": "<h3>Ortak özellikler (popüler uygulamalardan örnek alınan)</h3>\n<ul>\n<li><b>Online oda:</b> 4 harfli kodla katılım, boş koltuklara bot. Kopan oyuncunun yerine bot oynar; aynı isimle dönen yerini geri alır.</li>\n<li><b>Hamle süresi</b> (ayar: yok/20/30/60 sn): süre dolunca hamleyi bot yapar.</li>\n<li><b>Otomatik diz:</b> Seri Diz / Çift Diz, taşları sürükleyerek düzenleme, 101'de dizili per toplamı.</li>\n<li>Sohbet, emojiler, el sonu özet tablosu, açık eller.</li>\n</ul>\n<h3>Kaynaklar</h3>\n<ul>\n<li>pagat.com — Okey 101, Pişti kuralları</li>\n<li>Altinstar — Okey 101 resmi kuralları</li>\n<li>okey.gg — 101 (katlamalı mod, okey alma, siler, elden bitme)</li>\n<li>Wikipedia — Okey (20 puan düşme sistemi)</li>\n<li>App Store açıklamaları — Zynga 101 Okey Plus / Okey Plus, Batak Club, Fuzzy Batak &amp; Pişti, Batak İhaleli kural listesi</li>\n</ul>"};
/* ===================== ORTAK MOTOR ===================== */
const GAMES = {};
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clone = o => JSON.parse(JSON.stringify(o));
const sum = a => a.reduce((s, x) => s + x, 0);

/* ---- İskambil ---- */
// kart id 0..51 : suit = id/13|0 (0♠ 1♥ 2♦ 3♣), rank = id%13 + 2 (2..14, 14 = As)
const SUITS = ['♠', '♥', '♦', '♣'];
const SUIT_NAMES = ['Maça', 'Kupa', 'Karo', 'Sinek'];
const cSuit = id => (id / 13) | 0;
const cRank = id => (id % 13) + 2;
const RANK_TXT = r => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' }[r] || String(r));
const cardName = id => SUITS[cSuit(id)] + RANK_TXT(cRank(id));
const newDeck = () => shuffle([...Array(52).keys()]);

/* ---- Okey taşları ---- */
// taş id: renk c(0 sarı,1 mavi,2 siyah,3 kırmızı) * 26 + (n-1)*2 + kopya ; 104,105 sahte okey
const TCOL = ['Sarı', 'Mavi', 'Siyah', 'Kırmızı'];
function tile(id) { if (id >= 104) return { id, fake: true, c: -1, n: 0 }; return { id, c: (id / 26) | 0, n: (((id % 26) / 2) | 0) + 1, fake: false }; }
const newTiles = () => shuffle([...Array(106).keys()]);
function okeyCtx(indId) { const t = tile(indId); return { okC: t.c, okN: t.n === 13 ? 1 : t.n + 1 }; }
const isWild = (id, x) => { const t = tile(id); return !t.fake && t.c === x.okC && t.n === x.okN; };
const effT = (id, x) => { const t = tile(id); return t.fake ? { c: x.okC, n: x.okN } : { c: t.c, n: t.n }; };

// Geçerli per mi? {type, value, order} ya da null
function validGroup(ids, x) {
  if (!ids || ids.length < 3) return null;
  const W = ids.filter(i => isWild(i, x)), R = ids.filter(i => !isWild(i, x)).map(i => ({ id: i, ...effT(i, x) }));
  let best = null;
  const L = ids.length;
  // set: aynı sayı farklı renk
  if (L <= 4 && R.length >= 1 && R.every(r => r.n === R[0].n) && new Set(R.map(r => r.c)).size === R.length) {
    best = { type: 'set', value: R[0].n * L, order: [...R.map(r => r.id), ...W], n: R[0].n };
  }
  // seri: aynı renk ardışık
  if (R.length >= 1 && R.every(r => r.c === R[0].c) && new Set(R.map(r => r.n)).size === R.length && L <= 13) {
    for (const hi of [false]) { // 12-13-1 geçerli değil: 1 sadece serinin başında
      const nums = R.map(r => r.n);
      const mn = Math.min(...nums), mx = Math.max(...nums);
      if (mx - mn + 1 - R.length > W.length) continue;
      const maxEnd = 13;
      let s = Math.min(mn, maxEnd - L + 1);
      if (s < Math.max(1, mx - L + 1)) continue;
      const order = []; let wi = 0, value = 0;
      for (let p = s; p < s + L; p++) {
        const r = R.find((rr, k) => nums[k] === p);
        order.push(r ? r.id : W[wi++]); value += (p === 14 ? 1 : p);
      }
      if (!best || value > best.value) best = { type: 'run', value, order, c: R[0].c, start: s };
    }
  }
  return best;
}
function validPair(ids, x) {
  if (ids.length !== 2) return false;
  if (ids.some(i => isWild(i, x))) return true;
  const a = effT(ids[0], x), b = effT(ids[1], x); return a.c === b.c && a.n === b.n;
}
function pairValue(ids, x) { const r = ids.find(i => !isWild(i, x)); return r === undefined ? 0 : effT(r, x).n * 2; }

// En iyi per kombinasyonu (obj:'count' taş sayısı, 'value' puan)
function solveGroups(ids, x, obj) {
  const wild = ids.filter(i => isWild(i, x));
  const reals = ids.filter(i => !isWild(i, x)).map(i => ({ id: i, ...effT(i, x) })).sort((a, b) => a.c - b.c || a.n - b.n || a.id - b.id);
  const N = reals.length, memo = new Map();
  const score = g => obj === 'value' ? validGroup(g, x).value : g.length;
  function rec(mask, w) {
    if (mask === 0) return { s: 0, g: [] };
    const key = mask * 4 + w; if (memo.has(key)) return memo.get(key);
    let i = 0; while (!(mask & (1 << i))) i++;
    const t = reals[i], rest = mask & ~(1 << i);
    let best = rec(rest, w); best = { s: best.s, g: best.g };
    const tryG = (gIds, m2, w2) => { const v = validGroup(gIds, x); if (!v) return; const r = rec(m2, w2); const s = r.s + score(gIds); if (s > best.s) best = { s, g: [v.order, ...r.g] }; };
    // set
    const byCol = {}; for (let k = 0; k < N; k++) if ((rest & (1 << k)) && reals[k].n === t.n && reals[k].c !== t.c && byCol[reals[k].c] === undefined) byCol[reals[k].c] = k;
    const cand = Object.values(byCol);
    for (let sub = 0; sub < (1 << cand.length); sub++) {
      const pick = cand.filter((_, k) => sub & (1 << k)); let m2 = rest; for (const k of pick) m2 &= ~(1 << k);
      for (let ww = 0; ww <= w; ww++) { const L = 1 + pick.length + ww; if (L < 3 || L > 4) continue; tryG([t.id, ...pick.map(k => reals[k].id), ...wild.slice(wild.length - w, wild.length - w + ww)], m2, w - ww); }
    }
    // seri yukarı doğru
    const chain = (dir, startN) => {
      const out = [];
      const go = (n, m2, w2, gIds) => {
        if (gIds.length >= 3) tryG(gIds, m2, w2);
        if (gIds.length >= 13) return;

    h += `<div class="plate p${rel} ${v.turn === s && !['roundEnd', 'over', 'trickEnd'].includes(v.phase) ? 'turn' : ''} ${p.online === false ? 'off' : ''}">${b}${clk}<div class="av">${p.av}</div><div><div class="nm" style="color:${SEATCOL[s]}">${esc(p.name)}${p.online === false ? ' (koptu)' : ''}${tmTag}</div><div class="sc">Puan: <b>${v.scores[s]}</b></div><div class="bd">${extra}</div></div></div>`;
  }
  $('plates').innerHTML = h; tickClock();
}
function tickClock() { const el = document.querySelector('[data-clock]'); if (!el) return; const r = Math.max(0, Math.ceil((APP.deadline - Date.now()) / 1000)); el.textContent = '⏱ ' + r; el.classList.toggle('ok', r > 10); }
setInterval(tickClock, 500);
function renderInfo(v) {
  const E = GAMES[v.g]; let h = `<div class="gn">${E.icon} ${E.name}</div>`;
  if (v.g === 'pisti') h += `${v.round}. el · ${v.target} sayıya` + (v.teams ? ' · Eşli' : '');
  else if (v.g === 'okey') h += `${v.round}. el · ${v.start}'den düşme`;
  else h += `${v.round}/${v.rounds}. el`;
  if (v.g === 'batak') h += ' · ' + ['İhaleli', 'Eşli ihaleli', 'Koz Maça'][v.mode] + (v.scoring ? ' · ×10' : '');
  if (v.g === 'okey101') h += ` · ${v.katla ? 'Katlamalı' : 'Katlamasız'} · açış: <b>${v.need.seri}</b> / <b>${v.need.cift}</b> çift`;
  if (v.g === 'batak' && v.trump >= 0) h += `<br>Koz: <b style="font-size:20px;color:${v.trump === 1 || v.trump === 2 ? '#ff8a80' : '#fff'}">${SUITS[v.trump]}</b> ${SUIT_NAMES[v.trump]}` + (v.mode !== 2 ? ` · İhale: <b>${v.curBid}</b> (${esc(nameOf(v.bidder))})` : '');
  if (E.kind === 'tiles') h += `<br>Okey taşı: <b class="c${v.x.okC}" style="font-size:18px;background:#fffaf0;padding:0 6px;border-radius:4px">${v.x.okN}</b> (${TCOL[v.x.okC]}) · ★ sahte okey`;
  if (APP.mode === 'host' && APP.H) h += `<br><span class="muted">Oda: <b>${APP.H.code}</b></span>`;
  $('info').innerHTML = h;
}
function btn(label, fn, cls) { const b = document.createElement('button'); b.className = 'sm ' + (cls || ''); b.innerHTML = label; b.onclick = fn; return b; }
function renderActions(v) {
  const A = $('actions'); A.innerHTML = ''; const st = $('status'); const myTurn = v.turn === APP.mySeat; let s = '';
  const tn = esc(nameOf(v.turn));
  if (v.phase === 'roundEnd') s = 'El bitti, yeni el birazdan…'; else if (v.phase === 'over') s = 'Oyun bitti';
  else if (v.phase === 'trickEnd') s = `${esc(nameOf(v.trickWinner))} eli aldı`;
  if (v.g === 'batak') {
    if (v.phase === 'bid' && v.mode === 2) { s = myTurn ? 'Koz maça — kaç el alacaksın?' : `${tn} sözünü düşünüyor…`;
      if (myTurn) for (let b = 1; b <= 13; b++) A.appendChild(btn(String(b), () => sendAct({ type: 'bid', bid: b }))); }
    else if (v.phase === 'bid') { s = myTurn ? 'İhale sırası sende' : `${tn} ihale düşünüyor…`;
      if (myTurn) { A.appendChild(btn('Pas', () => sendAct({ type: 'bid', bid: 'pass' }), 'ghost')); for (let b = Math.max(v.minBid, v.curBid + 1); b <= Math.min(13, Math.max(v.minBid, v.curBid + 1) + 6); b++) A.appendChild(btn(String(b), () => sendAct({ type: 'bid', bid: b }))); } }
    else if (v.phase === 'trump') { s = myTurn ? 'İhale sende! Kozu seç' : `${tn} kozu seçiyor…`; if (myTurn) [0, 1, 2, 3].forEach(su => A.appendChild(btn(`<span style="font-size:20px;color:${su === 1 || su === 2 ? '#b71c1c' : '#111'}">${SUITS[su]}</span> ${SUIT_NAMES[su]}`, () => sendAct({ type: 'trump', suit: su })))); }
    else if (v.phase === 'play') s = myTurn ? 'Sıra sende — kart oyna' : `${tn} oynuyor…`;
  }
  if (v.g === 'pisti' && v.phase === 'play') s = myTurn ? 'Sıra sende — kart at' : `${tn} oynuyor…`;
  if (GAMES[v.g].kind === 'tiles' && (v.phase === 'draw' || v.phase === 'discard')) {
    const is101 = v.g === 'okey101';
    if (v.canShow) A.appendChild(btn('🎯 Gösterge Yap', () => sendAct({ type: 'gosterge' }), 'red'));
    if (myTurn && v.phase === 'draw') { s = 'Sıra sende — ortadan çek ya da soldakini al'; A.appendChild(btn('⬇ Ortadan Çek', () => sendAct({ type: 'draw', from: 'pile' }), 'green')); const ls = (APP.mySeat + 3) % 4; if (v.dcount[ls] && !(is101 && v.noTake)) A.appendChild(btn('⬅ Yandan Al', () => sendAct({ type: 'draw', from: 'left' }))); }
    else if (myTurn) {
      s = is101 && v.mustUse !== null ? 'Yandan aldığın taşı (kırmızı) bu turda kullanmalısın' : 'Bir taş seç ve at' + (is101 ? '' : ' ya da bitir');
      A.appendChild(btn('Taş At', rackDiscard, RACK.sel === null ? 'ghost' : 'green'));
      if (!is101) A.appendChild(btn('🏁 Bitir', () => { if (RACK.sel === null) return toast('Bitirmek için atacağın taşı seç'); sendAct({ type: 'finish', tile: RACK.sel }); }, 'red'));
      if (is101) {
        const op = v.opened[APP.mySeat], x = v.x, gs = rackGroups();
        if (!op) {
          A.appendChild(btn('Seri Aç', () => sendAct({ type: 'open', kind: 'seri', groups: gs.filter(g => validGroup(g, x)) }), 'red'));
          A.appendChild(btn('Çift Aç', () => sendAct({ type: 'open', kind: 'cift', groups: gs.filter(g => validPair(g, x)) }), 'red'));
        } else {
          A.appendChild(btn('Per İndir', () => { const gg = op === 'cift' ? gs.filter(g => validPair(g, x)) : gs.filter(g => validGroup(g, x)); if (!gg.length) return toast('Istakada yan yana dizili geçerli per yok'); sendAct({ type: 'lay', groups: gg }); }));
          if (v.canAddNow) A.appendChild(btn('İşle / Okey Al', () => { if (RACK.sel === null) return toast('İşlenecek taşı seç, sonra masadaki pere tıkla'); const e = effT(RACK.sel, x); let m = isWild(RACK.sel, x) ? -1 : v.melds.findIndex(m => m.type !== 'pair' && wildSlots(m.ids, x).some(w => w.c === e.c && w.n === e.n)); if (m < 0) m = v.melds.findIndex(m => m.type !== 'pair' && validGroup(m.ids.concat([RACK.sel]), x)); if (m < 0) return toast('Bu taş masadaki hiçbir pere uymuyor'); sendAct({ type: 'add', tile: RACK.sel, meld: m }); RACK.sel = null; }));
        }
        if (v.mustUse !== null) A.appendChild(btn('↩ Geri Ver', () => sendAct({ type: 'giveBack' }), 'ghost'));
      }
    } else s = `${tn} oynuyor…`;
    A.appendChild(btn('Seri Diz', () => { autoArrange('seri'); renderRack(APP.v); }, 'ghost'));
    A.appendChild(btn('Çift Diz', () => { autoArrange('cift'); renderRack(APP.v); }, 'ghost'));
  }
  st.innerHTML = s; st.className = myTurn && !['roundEnd', 'over', 'trickEnd'].includes(v.phase) ? 'me' : '';
}

/* ---- özet ---- */
function showSummary(v) {
  const S = v.summary; $('sumT').textContent = S.title;
  const totals = S.rows.map(r => r.total); const best = S.lowWins ? Math.min(...totals) : Math.max(...totals);
  let h = '<table class="sum"><tr><th>Oyuncu</th>' + S.rows[0].cells.map(() => '<th></th>').join('') + '<th>Toplam</th></tr>';
  for (const r of S.rows) {
    h += `<tr class="${r.total === best ? 'win' : ''}"><td>${APP.players[r.seat] ? APP.players[r.seat].av : ''} ${esc(nameOf(r.seat))}</td>${r.cells.map(c => `<td>${esc(c)}</td>`).join('')}<td><b>${r.total}</b></td></tr>`;
    if (v.reveal && v.reveal[r.seat] && v.reveal[r.seat].length) h += `<tr><td colspan="9"><div class="revealRow">${v.reveal[r.seat].map(t => { const q = tile(t); return `<span class="mt ${q.fake ? '' : 'c' + q.c}">${q.fake ? '★' : q.n}</span>`; }).join('')}</div></td></tr>`;
  }
  h += '</table>';
  const wn = v.teams && v.winTeam >= 0 ? `Takım ${v.winTeam + 1} (${esc(nameOf(v.winTeam))} & ${esc(nameOf(v.winTeam + 2))})` : esc(nameOf(v.winner));
  if (v.phase === 'over') h = `<p style="text-align:center;font-size:20px;margin-bottom:12px">🏆 Kazanan: <b style="color:#f7d77d">${wn}</b></p>` + h;
  else h += '<p class="muted" style="text-align:center;margin-top:10px">Yeni el birkaç saniye içinde başlayacak…</p>';
  $('sumB').innerHTML = h; const B = $('sumBtns'); B.innerHTML = '';
  if (v.phase === 'over') {
    if (APP.mode !== 'guest') { B.appendChild(btn('🔁 Tekrar Oyna', restartGame, 'green')); B.appendChild(btn(APP.mode === 'solo' ? 'Ana Menü' : 'Lobiye Dön', toLobby)); }
    else { B.appendChild(btn('Kapat', () => $('mSum').classList.remove('on'), 'ghost')); B.appendChild(btn('Odadan Çık', backHome, 'red')); }
    if (v.winner === APP.mySeat) snd('win');
  } else B.appendChild(btn('Masayı Gör', () => $('mSum').classList.remove('on'), 'ghost'));
  $('mSum').classList.add('on');
}
$('bScore').onclick = () => { const v = APP.v; if (!v) return; if (v.summary) { showSummary(Object.assign({}, v, { phase: v.phase === 'over' ? 'over' : 'roundEnd' })); return; } toast('Henüz el bitmedi — puanlar isim kartlarında', true); };

</script></body></html>
